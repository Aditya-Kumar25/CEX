name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend -> Vercel
      - name: Deploy Frontend to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # backend, engine, Ws -> Railway
      - name: Deploy Services to Railway
        run: |
          npm install --global @railway/cli
          
          echo "Deploying backend to Railway..."
          cd backend
          railway deploy --service backend -t ${{ secrets.RAILWAY_TOKEN }}
          
          echo "Deploying engine to Railway..."
          cd ../engine
          railway deploy --service engine -t ${{ secrets.RAILWAY_TOKEN }}
          
          echo "Deploying WebSocket gateway to Railway..."
          cd ../Ws
          railway deploy --service ws -t ${{ secrets.RAILWAY_TOKEN }}
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
